<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lor Focus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF9F6; --card:#F6F4EE; --ink:#1A1A18; --muted:#7A756C; --faint:#9A9488;
  --line:rgba(26,26,24,.08); --line2:rgba(26,26,24,.06); --focus:#4A6B57; --primary:#3E5B49;
  --on-primary:#F7F5F0; --quiet:#B0765E; --chip:#EAE7DF; --hair:rgba(26,26,24,.16);
  --logo-ink:#1A1A18; --logo-acc:#4A6B57; --logo-paper:#FAF9F6;
  --serif:'Instrument Serif',Georgia,serif; --sans:'Instrument Sans',system-ui,sans-serif;
}
[data-dark="1"]{
  --paper:#1A1A18; --card:#211F1C; --ink:#F2F0EA; --muted:#9A958B; --faint:#7D786F;
  --line:rgba(242,240,234,.1); --line2:rgba(242,240,234,.065); --focus:#86A992; --primary:#8FB49B;
  --on-primary:#14170F; --quiet:#C89279; --chip:#2B2825; --hair:rgba(242,240,234,.2);
  --logo-ink:#F2F0EA; --logo-acc:#86A992; --logo-paper:#1A1A18;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--sans); background:#E8E5DE; color:var(--ink);
  display:flex; align-items:center; justify-content:center; min-height:100dvh; padding:24px;
  -webkit-font-smoothing:antialiased;
}
[data-dark="1"] ~ x{}
body:has(#frame[data-dark="1"]){background:#0F0E0D}
#frame{
  position:relative; width:390px; height:844px; max-height:calc(100dvh - 24px);
  background:var(--paper); color:var(--ink); border-radius:44px; overflow:hidden;
  display:flex; flex-direction:column; box-shadow:0 30px 70px -26px rgba(26,26,24,.32),0 2px 6px rgba(26,26,24,.06);
  outline:1px solid rgba(26,26,24,.07); outline-offset:-1px;
}
@media (max-width:430px){
  body{padding:0}
  #frame{width:100vw; height:100dvh; max-height:none; border-radius:0; outline:none}
}
/* status bar */
.sb{display:flex;justify-content:space-between;align-items:center;padding:16px 26px 0;font-size:12px;flex:none}
.sb .batt{display:flex;gap:5px;align-items:center}
.sb .batt i{display:block;border:1.2px solid var(--ink);border-radius:2px;opacity:.5}
.sb .batt i.a{width:13px;height:9px}.sb .batt i.b{width:20px;height:10px;border-radius:3px}
/* generic */
.scroll{flex:1;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}
.pad{padding:0 24px}
.spacer{flex:1}
h1.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.005em;margin:0}
.display{font-family:var(--serif);font-weight:400;letter-spacing:-.015em;font-variant-numeric:tabular-nums;line-height:.9}
.sub{font-size:14px;line-height:1.6;color:var(--muted)}
.eyebrow{font-size:11px;color:var(--faint);letter-spacing:.05em}
.btn{width:100%;height:56px;border-radius:28px;background:var(--primary);color:var(--on-primary);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;letter-spacing:.012em;
  border:none;cursor:pointer;font-family:var(--sans)}
.btn:disabled{background:color-mix(in srgb,var(--primary) 16%,transparent);color:rgba(128,128,128,.6);cursor:default}
.ghost{background:none;border:none;font-size:13px;color:var(--muted);cursor:pointer;font-family:var(--sans);text-align:center}
.card{background:var(--card);border:1px solid var(--line2);border-radius:16px}
.row{display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:none;border-right:none;border-top:none;font-family:var(--sans);color:inherit}
.mono{width:36px;height:36px;border-radius:11px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--muted);flex:none}
.chev{flex:none;color:var(--faint)}
.link{color:var(--focus);cursor:pointer;font-size:14px;background:none;border:none;font-family:var(--sans);padding:0}
/* toggle */
.tg{width:46px;height:28px;border-radius:14px;padding:3px;display:flex;flex:none;cursor:pointer;transition:background .32s ease}
.tg i{width:22px;height:22px;border-radius:11px;background:#FAF9F6;transition:margin-left .32s ease}
[data-dark="1"] .tg i{background:#F2F0EA}
.tg.on{background:var(--focus)} .tg.on i{margin-left:18px}
.tg.off{background:var(--hair)} .tg.off i{margin-left:0}
/* bottom nav */
.nav{display:flex;gap:2px;padding:12px 16px 26px;border-top:1px solid var(--line);flex:none}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:var(--faint);font-family:var(--sans)}
.nav button span{font-size:10px}
.nav button.act{color:var(--ink)}
.nav button.act svg{stroke:var(--ink)}
.nav button svg{stroke:var(--faint)}
.topbar{display:flex;align-items:center;gap:16px}
.topbar .back{background:none;border:none;cursor:pointer;padding:0;display:flex;color:var(--ink)}
/* breathing */
@keyframes lfbreathe{0%,100%{transform:scale(.82);opacity:.45}50%{transform:scale(1.04);opacity:.9}}
@keyframes lfbreathe2{0%,100%{transform:scale(.95);opacity:.25}50%{transform:scale(1.12);opacity:.5}}
.b-outer{position:absolute;width:240px;height:240px;border-radius:120px;background:color-mix(in srgb,var(--focus) 12%,transparent);animation:lfbreathe2 7s ease-in-out infinite}
.b-inner{position:absolute;width:170px;height:170px;border-radius:85px;background:color-mix(in srgb,var(--focus) 18%,transparent);animation:lfbreathe 7s ease-in-out infinite}
/* logo picker */
.logogrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.logotile{aspect-ratio:1;border-radius:20px;border:1.4px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:border-color .2s,background .2s;position:relative}
.logotile.sel{border-color:var(--focus);background:color-mix(in srgb,var(--focus) 9%,transparent)}
.logotile .nm{font-size:12px;color:var(--muted)}
.logotile.sel .nm{color:var(--focus)}
.logotile .tick{position:absolute;top:10px;right:10px;opacity:0;transition:opacity .2s}
.logotile.sel .tick{opacity:1}
.seg{display:flex;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:4px}
.seg button{flex:1;height:40px;border-radius:9px;border:none;background:none;font-size:14px;color:var(--muted);cursor:pointer;font-family:var(--sans)}
.seg button.on{background:var(--paper);color:var(--ink)}
[data-dark="1"] .seg button.on{background:#2B2825}
.dash{height:50px;border-radius:25px;border:1.2px dashed color-mix(in srgb,var(--focus) 45%,transparent);color:var(--focus);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;cursor:pointer;background:none;width:100%;font-family:var(--sans)}
.chip{height:36px;padding:0 16px;border-radius:18px;background:var(--card);border:1px solid var(--line2);display:flex;align-items:center;font-size:13px;color:var(--muted)}
textarea{width:100%;border:none;background:none;resize:none;font-family:var(--sans);font-size:18px;line-height:1.6;color:var(--ink);outline:none}
input[type=time]{border:none;background:none;font-family:var(--sans);font-size:17px;color:var(--ink);outline:none}
input.search{flex:1;border:none;background:none;font-family:var(--sans);font-size:15px;color:var(--ink);outline:none}
.stepbtn{width:38px;height:38px;border-radius:19px;border:1.2px solid var(--hair);display:flex;align-items:center;justify-content:center;cursor:pointer;background:none;color:var(--ink)}
.mode-opt{border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line2);cursor:pointer;width:100%;font-family:var(--sans);font-size:15px;color:var(--ink)}
.mode-opt.sel{background:color-mix(in srgb,var(--focus) 9%,transparent);border:1.2px solid color-mix(in srgb,var(--focus) 40%,transparent)}
.radio{width:18px;height:18px;border-radius:9px;border:1.4px solid var(--hair);display:flex;align-items:center;justify-content:center;flex:none}
.mode-opt.sel .radio{border-color:var(--focus)}
.radio i{width:9px;height:9px;border-radius:5px;background:transparent}
.mode-opt.sel .radio i{background:var(--focus)}
</style>
</head>
<body>
<div id="frame"></div>
<script>
"use strict";
/* ---------- honey badger logo marks ---------- *
 * Each returns SVG using currentColor-ish vars: .ink fill = var(--logo-ink),
 * .acc fill = var(--logo-acc) (sage mantle), .pp = paper cut-outs (eyes). */
const LOGOS = {
  mantle: {name:'Mantle', svg:`
    <path class="ink" d="M32 8c-11 0-17 6-18 16-1 9 4 24 18 32 14-8 19-23 18-32-1-10-7-16-18-16Z"/>
    <path class="acc" d="M14 24c1-10 7-16 18-16s17 6 18 16c-11-5-25-5-36 0Z"/>
    <circle class="pp" cx="25" cy="31" r="2.1"/><circle class="pp" cx="39" cy="31" r="2.1"/>
    <path class="pp" d="M32 40c-1.7 0-2.9 1.2-2.9 2.6S30.3 45 32 45s2.9-1 2.9-2.4S33.7 40 32 40Z" opacity=".85"/>`},
  roundel: {name:'Roundel', svg:`
    <circle class="acc" cx="32" cy="32" r="30"/>
    <path class="pp" d="M32 14c-9 0-14 5-14.6 13C16.8 34 21 45 32 51c11-6 15.2-17 14.6-24C46 19 41 14 32 14Z"/>
    <circle class="acc" cx="25.5" cy="31" r="2.4"/><circle class="acc" cx="38.5" cy="31" r="2.4"/>
    <path class="acc" d="M32 39c-1.8 0-3 1.2-3 2.6s1.2 2.6 3 2.6 3-1.2 3-2.6-1.2-2.6-3-2.6Z"/>`},
  line: {name:'Line', svg:`
    <g fill="none" stroke="var(--logo-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 11c-11 0-17 6.5-17 16.5C15 38 20 50 32 54c12-4 17-16 17-26.5C49 17.5 43 11 32 11Z"/>
      <path d="M19 13c-2-3-3.5-5-2.5-6.5S21 8 22.5 11"/>
      <path d="M45 13c2-3 3.5-5 2.5-6.5S43 8 41.5 11"/>
      <path d="M25 15 24 33" stroke-width="3.4"/>
      <path d="M39 15 40 33" stroke-width="3.4"/>
      <circle cx="25" cy="31" r="1.5" fill="var(--logo-paper)" stroke="none"/>
      <circle cx="39" cy="31" r="1.5" fill="var(--logo-paper)" stroke="none"/>
      <path d="M28.5 42q3.5 4 7 0"/>
    </g>`},
  crest: {name:'Crest', svg:`
    <path class="ink" d="M12 12h40v22c0 12-9 20-20 24-11-4-20-12-20-24V12Z" opacity=".92"/>
    <path class="acc" d="M12 12h40v11c-13-4-27-4-40 0V12Z"/>
    <g fill="none" stroke="var(--logo-paper)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 27c-6 0-9 3.5-9.5 9C22 42 25 48 32 51c7-3 10-9 9.5-15C41 30.5 38 27 32 27Z"/>
      <circle cx="27.5" cy="38" r="1.3" fill="var(--logo-paper)" stroke="none"/>
      <circle cx="36.5" cy="38" r="1.3" fill="var(--logo-paper)" stroke="none"/>
    </g>`},
  claw: {name:'Claw', svg:`
    <path class="acc" d="M16 12c8 6 12 14 12 24 0 8-4 14-11 18 10-1 20-9 20-22 0-9-8-18-21-20Z" opacity=".9"/>
    <g fill="none" stroke="var(--logo-ink)" stroke-width="3.2" stroke-linecap="round">
      <path d="M20 16c9 4 15 12 16 22"/>
      <path d="M30 13c8 5 13 13 14 23"/>
      <path d="M40 12c6 6 9 14 9 24"/>
    </g>`},
  ridge: {name:'Ridge', svg:`
    <path class="ink" d="M6 35c-1-3 2-6 5-6 1-4 5-6 9-5l1-3c1-2 3-2 4 0l1 3c9-2 22-1 29 3 4 2 6 5 5 8-1 4-5 6-9 6H12c-4 0-5-2-6-4Z"/>
    <path class="ink" d="M18 44h5v6h-5zM26 45h5v5h-5zM37 45h5v5h-5zM45 44h5v6h-5z"/>
    <path class="acc" d="M9 31c3-3 7-4 10-3 8-3 21-3 30 1 3 1 5 3 5 5-8-4-19-6-30-5-6 .5-11 1-15 2Z"/>
    <circle class="pp" cx="16" cy="34" r="1.5"/>`}
};
const LOGO_ORDER = ['mantle','roundel','line','crest','claw','ridge'];
function logoSVG(id,size){
  const l = LOGOS[id] || LOGOS.mantle;
  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" style="display:block">
    <style>svg .ink{fill:var(--logo-ink)}svg .acc{fill:var(--logo-acc)}svg .pp{fill:var(--logo-paper)}</style>
    ${l.svg}</svg>`;
}

/* ---------- icons ---------- */
const I = {
  gear:`<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="2.6"/><path d="M10 3v1.6M10 15.4V17M3 10h1.6M15.4 10H17M5.1 5.1l1.1 1.1M13.8 13.8l1.1 1.1M14.9 5.1l-1.1 1.1M6.2 13.8l-1.1 1.1"/></svg>`,
  chev:`<svg class="chev" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 4l5 5-5 5"/></svg>`,
  back:`<svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13 5l-6 6 6 6"/></svg>`,
  close:`<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 5l8 8M13 5l-8 8"/></svg>`,
  check:`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 8.5 6.5 11.5 12.5 5"/></svg>`,
  minus:`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 8h8"/></svg>`,
  plus:`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 8h8M8 4v8"/></svg>`,
  search:`<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="5.2"/><path d="M12 12l3 3"/></svg>`,
  block:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 18 18 6"/></svg>`,
  pause:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`,
  bars:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 16V9M12 16V5M19 16v-4"/></svg>`,
  info:`<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="var(--focus)" stroke-width="1.5" stroke-linecap="round" style="flex:none;margin-top:2px"><circle cx="9" cy="9" r="6.6"/><path d="M9 5.8V9l2.2 1.4"/></svg>`,
  nToday:`<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="6.9"/><path d="M10 6.3V10l2.4 1.5"/></svg>`,
  nRules:`<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h8"/></svg>`,
  nFocus:`<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="6.9"/><circle cx="10" cy="10" r="2.2"/></svg>`,
  nInsights:`<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.5" stroke-linecap="round"><path d="M4 15V9M10 15V5M16 15v-3"/></svg>`,
};

/* ---------- state ---------- */
const DEFAULT = {
  onboarded:false, screen:'welcome', tab:'today', theme:'system', logo:'mantle',
  perms:{access:true, overlay:false, usage:false},
  feeds:[
    {id:'ys',name:'YouTube Shorts',mono:'YS',on:true,mode:'block',budget:15,pauseSec:10,from:'07:00',until:'23:00'},
    {id:'ir',name:'Instagram Reels',mono:'IR',on:true,mode:'limit',budget:15,pauseSec:10,from:'07:00',until:'23:00'},
    {id:'fr',name:'Facebook Reels',mono:'FR',on:true,mode:'pause',budget:15,pauseSec:10,from:'07:00',until:'23:00'},
    {id:'tt',name:'TikTok',mono:'TT',on:true,mode:'block',budget:15,pauseSec:10,from:'07:00',until:'23:00'},
    {id:'ss',name:'Snapchat Spotlight',mono:'SS',on:true,mode:'pause',budget:15,pauseSec:10,from:'07:00',until:'23:00'},
  ],
  approach:'pause',
  learning:true, strict:true, uninstall:false, cooldown:10,
  channels:[
    {n:'Physics with Anand',when:'Added 3 days ago'},
    {n:'Maths Made Slow',when:'Added last week'},
    {n:'Chem Basics Daily',when:'Added last week'},
    {n:'Long Reads, Read Aloud',when:'Added in May'},
  ],
  goal:'I want my evenings back — reading, not scrolling until 1am.',
  editing:null, back:'settings', countdown:10,
};
let S = load();
function load(){
  try{ const raw = localStorage.getItem('lorfocus');
    if(raw){ return Object.assign(structuredClone(DEFAULT), JSON.parse(raw)); } }catch(e){}
  return structuredClone(DEFAULT);
}
function save(){
  const {editing,countdown,back,...keep} = S; // don't persist transient
  try{ localStorage.setItem('lorfocus', JSON.stringify(keep)); }catch(e){}
}
function set(patch){ Object.assign(S, patch); save(); render(); }
function feed(id){ return S.feeds.find(f=>f.id===id); }

/* ---------- theme ---------- */
const mq = window.matchMedia('(prefers-color-scheme: dark)');
function isDark(){ return S.theme==='dark' || (S.theme==='system' && mq.matches); }
mq.addEventListener('change', ()=>{ if(S.theme==='system') render(); });

/* ---------- helpers ---------- */
const el = document.getElementById('frame');
function sb(time){ return `<div class="sb"><span>${time||'9:41'}</span><div class="batt"><i class="a"></i><i class="a"></i><i class="b"></i></div></div>`; }
function nav(active){
  const t=(id,ico,label)=>`<button data-tab="${id}" class="${active===id?'act':''}">${ico}<span>${label}</span></button>`;
  return `<div class="nav">${t('today',I.nToday,'Today')}${t('rules',I.nRules,'Rules')}${t('focus',I.nFocus,'Focus')}${t('insights',I.nInsights,'Insights')}</div>`;
}
function modeSummary(f){
  if(f.mode==='block') return 'Blocked fully';
  if(f.mode==='pause') return `${f.pauseSec} second pause`;
  return `${f.budget} min a day · ${f.from}–${f.until}`;
}

/* ---------- screens ---------- */
const SCREENS = {

welcome(){ return sb()+`<div class="scroll pad" style="padding-bottom:32px">
  <div class="spacer" style="display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:60%">
    <button data-act="logopicker" style="background:none;border:none;padding:0;cursor:pointer;align-self:flex-start" title="Choose your emblem">${logoSVG(S.logo,44)}</button>
    <div class="display" style="font-size:42px;line-height:1.1">Lor Focus</div>
    <div style="font-size:16px;line-height:1.6;color:var(--muted);max-width:250px">Take back your attention.</div>
    <button class="link" data-act="logopicker" style="align-self:flex-start">Choose your emblem →</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:18px;align-items:center">
    <button class="btn" data-act="go:howworks">Get started</button>
    <button class="ghost" data-act="skip">I've used Lor Focus before</button>
  </div></div>`; },

howworks(){ const step=(ico,t,d)=>`<div style="display:flex;gap:18px;align-items:flex-start"><span style="color:var(--focus)">${ico}</span><div style="display:flex;flex-direction:column;gap:6px"><div style="font-size:17px;font-weight:500">${t}</div><div class="sub" style="max-width:250px">${d}</div></div></div>`;
  return sb()+`<div class="scroll" style="padding:44px 24px 32px">
    <h1 class="serif" style="font-size:32px;margin-bottom:44px">How it works</h1>
    <div style="display:flex;flex-direction:column;gap:38px">
      ${step(I.block,'Block the feeds','Shorts, Reels and Spotlight simply don’t open.')}
      ${step(I.pause,'Add gentle friction','A short pause, so the choice is yours again.')}
      ${step(I.bars,'Reclaim your time','See the hours come back, quietly.')}
    </div>
    <div class="spacer"></div>
    <div style="display:flex;gap:6px;justify-content:center;margin-bottom:22px">
      <div style="width:20px;height:3px;border-radius:2px;background:var(--focus)"></div>
      <div style="width:8px;height:3px;border-radius:2px;background:var(--hair)"></div>
      <div style="width:8px;height:3px;border-radius:2px;background:var(--hair)"></div></div>
    <button class="btn" data-act="go:permissions">Continue</button></div>`; },

permissions(){ const p=S.perms;

  return sb()+`<div class="scroll" style="padding:26px 24px 32px">

    <div style="font-size:14px;line-height:1.65;color:var(--muted);margin-bottom:30px;max-width:290px">Write it in your own words. You’ll see it on the quiet screens, when it helps most.</div>
    <div class="card" style="padding:22px;min-height:130px;display:flex;flex-direction:column">
      <textarea id="goalText" maxlength="140" style="flex:1">${S.goal.replace(/</g,'&lt;')}</textarea>
      <div id="goalCount" style="font-size:11px;color:var(--faint);text-align:right">${S.goal.length} / 140</div></div>
    <div class="eyebrow" style="margin-top:22px;margin-bottom:12px">Earlier notes</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${notes.map(n=>`<div style="padding:18px 20px;border-radius:12px;border:1px solid var(--line);font-size:15px;line-height:1.6;color:var(--muted)">${n}</div>`).join('')}</div>
    <div class="spacer"></div>
    <button class="btn" data-act="saveGoal">Save</button></div>`; },

/* interruptions */

/* ---------- render ---------- */
const MAIN_TABS={today:'today',rules:'rules',focus:'focus',insights:'insights'};
function render(){
  el.dataset.dark = isDark()?'1':'0';
  const fn = SCREENS[S.screen] || SCREENS.welcome;
  let html = fn();
  el.innerHTML = html;
}

/* ---------- actions ---------- */
el.addEventListener('click', e=>{
  const t = e.target.closest('[data-act],[data-tab],[data-time]');
  if(!t) return;
  if(t.dataset.tab){ set({tab:t.dataset.tab, screen:MAIN_TABS[t.dataset.tab]}); return; }
  const act = t.dataset.act; if(!act||act==='none') return;
  const [cmd,arg] = act.split(':');
  switch(cmd){
    case 'go': set({screen:arg, tab:MAIN_TABS[arg]||S.tab}); break;
    case 'logopicker': set({screen:'logopicker'}); break;
    case 'skip': set({onboarded:true, screen:'today', tab:'today'}); break;
    case 'finish': set({onboarded:true, screen:'today', tab:'today',
        feeds:S.feeds.map(f=>({...f, mode:f.mode}))}); break;
    case 'perm': S.perms[arg]=true; set({}); break;
    case 'toggle': { const f=feed(arg); f.on=!f.on; set({}); break; }
    case 'approach': set({approach:arg, feeds:S.feeds.map(f=>({...f, mode:arg}))}); break;
    case 'pickLogo': set({logo:arg}); break;
    case 'rule': set({screen:'ruledetail', editing:arg}); break;
    case 'setmode': { const f=feed(S.editing); f.mode=arg; set({}); break; }
    case 'budget': { const f=feed(S.editing); f.budget=Math.max(5,Math.min(120,f.budget+(arg==='+'?5:-5))); set({}); break; }
    case 'pause': { const f=feed(S.editing); f.pauseSec=Math.max(3,Math.min(30,f.pauseSec+(arg==='+'?1:-1))); set({}); break; }
    case 'toggleLearning': set({learning:!S.learning}); break;
    case 'toggleStrict': set({strict:!S.strict}); break;
    case 'toggleUninstall': set({uninstall:!S.uninstall}); break;
    case 'theme': set({theme:arg}); break;
    case 'rmchan': S.channels.splice(+arg,1); set({}); break;
    case 'addchan': { const names=['Chem Basics Daily','Organic, Slowly','The Chem Notebook','Lab Notes 101'];
        const n=names[+arg]; if(!S.channels.some(c=>c.n===n)) S.channels.push({n,when:'Added just now'});
        set({screen:'focus'}); break; }
    case 'saveGoal': { const v=document.getElementById('goalText'); if(v) S.goal=v.value.trim()||S.goal; set({screen:'settings'}); break; }
    case 'privacy': alert('Lor Focus collects nothing and sends nothing. All settings, rules and statistics live on this phone and never leave it.'); break;
    case 'reset': if(confirm('Reset all data? This clears every rule, channel and setting on this phone.')){ localStorage.removeItem('lorfocus'); S=structuredClone(DEFAULT); render(); } break;
  }
});
/* live goal counter */
el.addEventListener('input', e=>{
  if(e.target.id==='goalText'){ const c=document.getElementById('goalCount'); if(c) c.textContent=`${e.target.value.length} / 140`; }
  if(e.target.dataset && e.target.dataset.time){ const f=feed(S.editing); if(f){ f[e.target.dataset.time]=e.target.value; save(); } }
});

/* ---------- breathing countdown ---------- */
setInterval(()=>{
  if(S.screen!=='pausescreen') return;
  const f=feed(S.editing);
  const reset=(f&&f.mode==='pause')?f.pauseSec:10;
  S.countdown = S.countdown>1 ? S.countdown-1 : reset;
  const node=el.querySelector('.display');
  if(S.screen==='pausescreen'){ // update only the number to avoid animation restart
    const num=el.querySelector('.b-inner')?.parentElement?.querySelector('.display');
    if(num) num.textContent=S.countdown;
  }
},1000);

/* start */
if(S.onboarded && S.screen==='welcome') S.screen='today';
render();
</script>
